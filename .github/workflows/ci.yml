name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ros2-jazzy:
    name: ROS 2 Jazzy build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure ROS 2 apt repository
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install ROS 2 Jazzy development tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep

      - name: Install rosdep dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo rosdep init 2>/dev/null || true
          rosdep update
          rosdep install \
            --from-paths ros2_ws/src \
            --ignore-src \
            --rosdistro jazzy \
            -y

      - name: Build workspace
        shell: bash
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build \
            --symlink-install \
            --event-handlers console_direct+

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          source install/setup.bash
          colcon test \
            --event-handlers console_direct+
          colcon test-result --verbose

  esp32-platformio:
    name: ESP32 PlatformIO build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-platformio.txt

      - name: Install PlatformIO
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-platformio.txt

      - name: Build ESP32 firmware
        shell: bash
        run: |
          set -euo pipefail
          cd firmware/esp32
          pio run

  documentation:
    name: Documentation strict build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: Build documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdocs build --strict --clean
