name: Publish Robotics Course
on:
  push:
    branches: [main]
    paths:
      - 'robotics-course/**'
      - '.github/workflows/robotics-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: robotics-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload standalone course
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./robotics-course
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
