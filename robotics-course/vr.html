<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robo Lab VR</title><script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script><style>body{margin:0}#info{position:fixed;z-index:5;top:14px;left:14px;max-width:320px;background:#071626df;color:white;padding:15px;border-radius:12px;font:14px system-ui,Tahoma}#info p{line-height:1.6}#info a{color:#7af1d8}#info button{background:#178777;border:0;padding:8px;color:white;border-radius:6px;cursor:pointer}</style></head><body><div id="info"><b>🤖 Robo Lab • VR 3D</b><p>หมุนมุมมองด้วยเมาส์/การสัมผัสหรือชุด VR<br>คลิกชิ้นส่วนเพื่ออ่านหน้าที่ (Desktop) หรือเล็งจุดกลางค้างไว้ (VR)</p><p id="detail">ภารกิจ: ระบุ Controller → Sensor → Actuator → Power และอธิบายวงจร Sense–Plan–Act</p><a href="index.html">กลับหน้าบทเรียน</a></div><a-scene background="color:#09162c" renderer="antialias:true; colorManagement:true" vr-mode-ui="enabled:true"><a-assets></a-assets><a-sky color="#132849"></a-sky><a-plane rotation="-90 0 0" width="30" height="30" color="#163e54"></a-plane><a-grid></a-grid><a-entity position="0 0 -4"><a-box position="0 0.55 0" width="1.8" height=".25" depth="1.15" color="#4f81a8" data-note="ฐานโครงสร้าง: รองรับอุปกรณ์และการเคลื่อนที่" class="clickable"></a-box><a-box position="0 1.03 0" width=".85" height=".65" depth=".72" color="#39ac9c" data-note="Controller: Raspberry Pi 4 รับคำสั่ง ROS 2 และคำนวณการเคลื่อนที่" class="clickable"></a-box><a-box position="0 1.5 -.16" width=".45" height=".25" depth=".35" color="#edc56d" data-note="Sensor: ตรวจสภาพแวดล้อมและส่งข้อมูลเข้าสู่ระบบควบคุม" class="clickable"></a-box><a-box position="-.62 .93 0" width=".25" height=".28" depth=".48" color="#e77e63" data-note="Actuator/Driver: ตัวขับและมอเตอร์เปลี่ยนคำสั่งไฟฟ้าเป็นการเคลื่อนที่" class="clickable"></a-box><a-box position=".62 .93 0" width=".25" height=".28" depth=".48" color="#e77e63" class="clickable" data-note="Actuator: ชุดมอเตอร์ด้านขวา"></a-box><a-box position="0 .84 .35" width=".5" height=".2" depth=".22" color="#ed6e96" data-note="Power: แบตเตอรี่และระบบจ่ายไฟให้ Pi/มอเตอร์ ต้องแยกภาคจ่ายอย่างเหมาะสม" class="clickable"></a-box><a-cylinder position="-.7 .37 .6" rotation="90 0 0" radius=".34" height=".16" color="#101826"></a-cylinder><a-cylinder position=".7 .37 .6" rotation="90 0 0" radius=".34" height=".16" color="#101826"></a-cylinder><a-cylinder position="-.7 .37 -.6" rotation="90 0 0" radius=".34" height=".16" color="#101826"></a-cylinder><a-cylinder position=".7 .37 -.6" rotation="90 0 0" radius=".34" height=".16" color="#101826"></a-cylinder><a-text value="SENSE -> PLAN -> ACT" align="center" color="#a4ffe9" position="0 2.15 0" width="4"></a-text></a-entity><a-entity position="0 1.6 2.3"><a-camera look-controls wasd-controls="acceleration:15"><a-cursor fuse="true" fuse-timeout="1300" raycaster="objects:.clickable" color="#ffffff"></a-cursor></a-camera></a-entity><a-light type="ambient" intensity=".7"></a-light><a-light type="directional" intensity=".9" position="2 5 2"></a-light></a-scene><script>document.querySelectorAll('.clickable').forEach(el=>el.addEventListener('click',()=>{document.getElementById('detail').textContent=el.getAttribute('data-note')}));</script></body></html>
